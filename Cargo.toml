[package]
name = "lstree"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
futures = "0.3.31"
nuon = "0.109.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = [ "full"] }

[profile.dev]
opt-level = 3
lto = "fat"
debug = false
codegen-units = 1
incremental = false
